appId: uz.uzatuv.desktop
productName: Uzatuv
copyright: Uzatuv

directories:
  output: release/${version}
  buildResources: build

# electron-vite chiqishi (main/preload/renderer) + main process runtime deps.
files:
  - out/**
  - "!**/*.map"

# asar ichiga qadoqlanadi; bonjour-service (main runtime) prod-dep sifatida kiradi.
asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

# NSIS o'rnatuvchi (installer). ${target} makrosi win.artifactName'da ishlamaydi —
# shuning uchun nom har target uchun alohida beriladi (nsis + portable).
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Uzatuv
  artifactName: ${productName}-Setup-${version}.${ext}

# Portable (o'rnatishsiz .exe)
portable:
  artifactName: ${productName}-${version}-portable.${ext}
